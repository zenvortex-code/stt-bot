name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: uv sync

    - name: Install ffmpeg (for pydub)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Validate bot can start
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: |
        timeout 10 uv run python main.py || code=$?
        if [ $code -eq 124 ]; then
          echo "Bot started successfully (killed after 10s as expected)"
          exit 0
        else
          echo "Bot failed to start"
          exit $code
        fi

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t stt-bot .
